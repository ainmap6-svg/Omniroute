# Railway: New Project -> Deploy from GitHub repo -> shu repo.
# Keyin: Settings -> Volumes -> Add Volume -> mount path /data
#        Settings -> Networking -> Generate Domain (port: 20128)
[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
# HTTP healthcheck yo'q: "/" login sahifasiga yo'naltiradi (302) va Railway
# buni xato deb hisoblaydi. Konteyner ishlab tursa — deploy muvaffaqiyatli.
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
