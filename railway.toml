# Railway: New Project -> Deploy from GitHub repo -> shu repo.
# Keyin: Settings -> Volumes -> Add Volume -> mount path /data
#        Settings -> Networking -> Generate Domain
[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
healthcheckPath = "/"
healthcheckTimeout = 120
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
